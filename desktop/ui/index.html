<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Cortala</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Cortala home"><span class="brand-icon">≋</span><span>Cortala<small>YOUR VOICE, UNINTERRUPTED</small></span></a>
      <div class="nav-label">WORKSPACE</div><nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom"><span class="status-dot"></span><span id="connection-status">Connecting…</span><small id="version"></small></div>
    </aside>
    <main>
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="page-name">Home</strong></div><span class="platform" id="platform">Desktop</span></header>
      <div class="content"><div id="notice" role="status" hidden></div><section id="page" aria-label="Page content"></section></div>
    </main>
  </div>
  <section id="capture-dock" class="capture-dock" aria-label="Recording status" hidden>
    <div class="dock-icon">≋</div><div class="dock-body"><div class="dock-heading"><strong id="capture-label">Listening</strong><span id="capture-time">0:00</span></div><div class="meter"><div id="capture-level"></div></div><p id="capture-partial"></p></div><button id="dock-stop" class="primary">Stop</button><button id="dock-cancel" class="icon-button" aria-label="Cancel recording">×</button>
  </section>
  <section id="copy-fallback" class="copy-fallback" aria-label="Transcript ready to copy" hidden><span class="eyebrow">TRANSCRIPT READY</span><p id="fallback-text"></p><div class="row"><button id="fallback-copy" class="primary">Copy transcript</button><button id="fallback-dismiss">Dismiss</button></div></section>
</body>
</html>
